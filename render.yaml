services:
  - type: web
    runtime: node
    name: medisync-api
    plan: free
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://sync-lite.onrender.com

  - type: web
    runtime: static
    name: medisync-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://medisync-api-tmap.onrender.com/api
